<mat-tab-group (selectedTabChange)="setContainer($event.tab.textLabel)">
  <mat-tab label="Inbox"></mat-tab>
  <mat-tab label="Outbox"></mat-tab>
</mat-tab-group>

<div class="flex flex-row justify-center w-full pt-6">
  <div class="w-auto min-w-2xl max-w-6xl!">
    <table mat-table [dataSource]="paginatedMessages()?.items!">

      <ng-container matColumnDef="sender">
        <th mat-header-cell *matHeaderCellDef> Sender </th>
        <td mat-cell *matCellDef="let element"> {{isInbox ? element.senderDisplayName : element.recipientDisplayName}}
        </td>
      </ng-container>

      <ng-container matColumnDef="content">
        <th mat-header-cell *matHeaderCellDef> Content </th>
        <td mat-cell *matCellDef="let element" class="truncate max-w-xl"> {{element.content}} </td>
      </ng-container>

      <ng-container matColumnDef="messageSent">
        <th mat-header-cell *matHeaderCellDef> Message sent </th>
        <td mat-cell *matCellDef="let element"> {{element.messageSent | date:'short'}} </td>
      </ng-container>

      <ng-container matColumnDef="delete">
        <th mat-header-cell *matHeaderCellDef> Action </th>
        <td mat-cell *matCellDef="let element">
          <button matIconButtond (click)="deleteMessage($event, element.id)" class="hover:cursor-pointer">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
        class="hover:bg-sky-700! hover:text-white! hover:cursor-pointer" (click)="goToMessages(row)"></tr>
    </table>
  </div>
</div>
